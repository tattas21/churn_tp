  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nospace;\n}\n*{box-sizing:border-box;margin:0;padding:0;}\nhtml{scroll-behavior:smooth;scroll-padding-top:32px;}\nbody{\n  font-family:var(--sans);\n  color:var(--n900);\n  background:var(--n50);\n  line-height:1.6;\n  font-size:18px;\n  -webkit-font-smoothing:antialiased;\n}\nh1,h2,h3,h4{line-height:1.2;letter-spacing:-0.02em;font-weight:700;}\na{color:var(--primary);text-decoration:none;}\nimg{max-width:100%;height:auto;display:block;}\n\n/* ---- Layout shell ---- */\n.shell{display:grid;grid-template-columns:240px 1fr;max-width:1400px;margin:0 auto;}\n.content{min-width:0;}\n.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad-x);}\n\n/* ---- Sidebar nav ---- */\n.sidebar{\n  position:sticky;top:0;height:100vh;\n  padding:48px 0 48px 32px;\n  display:flex;flex-direction:column;\n  border-right:1px solid var(--border);\n  background:var(--n50);\n}\n.sidebar .brand{font-weight:700;font-size:15px;color:var(--primary-dark);letter-spacing:-0.01em;margin-bottom:4px;}\n.sidebar .brand-sub{font-size:12px;color:var(--n500);margin-bottom:36px;text-transform:uppercase;letter-spacing:0.08em;}\n.navlist{list-style:none;display:flex;flex-direction:column;gap:2px;}\n.navlist a{\n  display:block;padding:8px 14px;font-size:14px;color:var(--n700);\n  border-radius:var(--radius-btn);border-left:2px solid transparent;\n  transition:background .18s,color .18s,border-color .18s;font-weight:500;\n}\n.navlist a:hover{background:var(--n100);color:var(--n900);}\n.navlist a.active{color:var(--primary);background:#eef4fa;border-left-color:var(--primary);font-weight:600;}\n\n/* ---- Mobile top bar ---- */\n.topbar{display:none;}\n\n/* ---- Hero ---- */\n.hero{\n  background:linear-gradient(135deg,#1a5490,#0f3a66);\n  color:#fff;padding:128px 0 112px;position:relative;overflow:hidden;\n}\n.hero::after{\n  content:\"\";position:absolute;inset:0;\n  background:radial-gradient(900px 500px at 85% -10%,rgba(255,255,255,.10),transparent 60%);\n  pointer-events:none;\n}\n.hero .wrap{position:relative;z-index:1;}\n.kicker{\n  font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.14em;\n  color:var(--primary);\n}\n.hero .kicker{color:#9ec5ec;}\n.hero h1{font-size:clamp(40px,6vw,68px);margin:18px 0 16px;max-width:16ch;}\n.hero .subtitle{font-size:clamp(20px,2.4vw,26px);font-weight:500;color:#cfe0f0;max-width:38ch;}\n.hero-meta{display:flex;flex-wrap:wrap;gap:40px;margin-top:56px;}\n.hero-meta .lbl{font-size:12px;text-transform:uppercase;letter-spacing:0.1em;color:#8fb4d8;margin-bottom:8px;}\n.hero-meta .team{font-size:15px;color:#e8f1fa;line-height:1.8;max-width:30ch;}\n.hero-meta .val{font-size:16px;color:#e8f1fa;font-weight:500;}\n.btn{\n  display:inline-flex;align-items:center;gap:9px;\n  padding:13px 22px;border-radius:var(--radius-btn);\n  font-size:15px;font-weight:600;cursor:pointer;border:none;\n  transition:transform .15s,box-shadow .15s,background .15s;font-family:var(--sans);\n}\n.btn-primary{background:#fff;color:var(--primary-dark);}\n.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.22);}\n.hero-cta{margin-top:48px;display:flex;gap:14px;flex-wrap:wrap;}\n\n/* ---- Sections ---- */\nsection.block{padding:var(--sec-gap) 0;border-top:1px solid var(--border);}\nsection.block:first-of-type{border-top:none;}\n.divider-head{margin-bottom:48px;}\n.divider-head .line{width:48px;height:3px;background:var(--accent);border-radius:2px;margin-bottom:20px;}\n.divider-head h2{font-size:clamp(30px,4vw,44px);max-width:22ch;}\n.divider-head p.lede{font-size:20px;color:var(--n700);margin-top:18px;max-width:60ch;}\n\n/* ---- Reveal animation ---- */\n.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease;}\n.reveal.in{opacity:1;transform:none;}\n@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none;}}\n\n/* ---- KPI cards ---- */\n.kpi-grid{display:grid;gap:24px;}\n.kpi-grid.cols-3{grid-template-columns:repeat(3,1fr);}\n.kpi-grid.cols-2{grid-template-columns:repeat(2,1fr);}\n.kpi{\n  background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);\n  padding:32px;transition:transform .2s,box-shadow .2s;\n}\n.kpi:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(15,58,102,.10);}\n.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:0.1em;color:var(--n500);font-weight:600;}\n.kpi .num{font-size:clamp(48px,6vw,76px);font-weight:700;color:var(--primary-dark);letter-spacing:-0.03em;line-height:1;margin:14px 0 12px;font-family:var(--sans);}\n.kpi .desc{font-size:15px;color:var(--n700);}\n.kpi.grad{background:linear-gradient(135deg,#1a5490,#0f3a66);border:none;color:#fff;}\n.kpi.grad .lbl{color:#9ec5ec;}\n.kpi.grad .num{color:#fff;}\n.kpi.grad .desc{color:#d6e6f4;}\n.kpi.accent .num{color:var(--accent);}\n.kpi.success .num{color:var(--success);}\n\n/* ---- Quote ---- */\n.bigquote{\n  font-size:clamp(26px,3.6vw,40px);font-weight:600;line-height:1.32;\n  color:var(--primary-dark);letter-spacing:-0.02em;max-width:24ch;\n}\n.bigquote .src{display:block;font-size:16px;font-weight:500;color:var(--n500);margin-top:24px;letter-spacing:0;}\nblockquote.callout{\n  border-left:4px solid var(--primary);background:#eef4fa;\n  padding:24px 28px;border-radius:0 var(--radius-card) var(--radius-card) 0;\n  font-style:italic;font-size:19px;color:var(--n700);\n}\n\n/* ---- Insight cards ---- */\n.insight{\n  display:grid;grid-template-columns:64px 1fr;gap:24px;align-items:start;\n  background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);\n  padding:28px 32px;transition:transform .2s,box-shadow .2s;\n}\n.insight:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(15,58,102,.10);}\n.insight .circ{\n  width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;\n  background:linear-gradient(135deg,#1a5490,#0f3a66);color:#fff;font-weight:700;font-size:24px;\n}\n.insight h3{font-size:22px;margin-bottom:8px;}\n.insight p{font-size:16px;color:var(--n700);}\n.insight .stat{color:var(--accent);font-weight:600;}\n.stack{display:flex;flex-direction:column;gap:20px;}\n\n/* ---- Recommendation cards ---- */\n.rec{\n  background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);\n  padding:28px 32px;transition:transform .2s,box-shadow .2s;\n}\n.rec:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(15,58,102,.10);}\n.rec h3{font-size:21px;margin-bottom:14px;}\n.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}\n.badge{font-size:12px;font-weight:600;padding:5px 11px;border-radius:100px;letter-spacing:0.02em;}\n.badge.pri-alta{background:#fde8e6;color:#c0392b;}\n.badge.pri-media{background:#fef3e0;color:#b9770e;}\n.badge.pri-baja{background:#e7f6ed;color:#1e8449;}\n.badge.neutral{background:var(--n100);color:var(--n700);}\n.rec .impact{\n  font-size:15px;color:var(--n700);border-top:1px solid var(--border);\n  padding-top:16px;margin-top:4px;\n}\n.rec .impact strong{color:var(--primary-dark);}\n\n/* ---- Limitation cards ---- */\n.lim{\n  background:#fffdf8;border:1px solid var(--border);border-left:4px solid var(--warning);\n  border-radius:0 var(--radius-card) var(--radius-card) 0;padding:24px 28px;\n}\n.lim h3{font-size:18px;margin-bottom:8px;color:#9a6310;}\n.lim p{font-size:15px;color:var(--n700);}\n\n/* ---- Figure ---- */\nfigure.chart{\n  background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);\n  padding:24px;margin-top:8px;\n}\nfigure.chart img{border-radius:6px;margin:0 auto;}\nfigure.chart figcaption{font-size:14px;color:var(--n500);margin-top:18px;text-align:center;max-width:64ch;margin-left:auto;margin-right:auto;}\n\n/* ---- Steps list ---- */\nol.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px;}\nol.steps li{\n  counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:18px;align-items:baseline;\n  background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:20px 24px;\n  font-size:17px;color:var(--n700);\n}\nol.steps li::before{\n  content:counter(s);background:var(--primary);color:#fff;font-weight:700;font-size:15px;\n  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;\n}\nol.steps li strong{color:var(--n900);}\n\n/* ---- Lead text ---- */\n.lead{font-size:19px;color:var(--n700);max-width:64ch;}\n.lead strong{color:var(--n900);}\n\n/* ---- Footer ---- */\nfooter{background:var(--primary-dark);color:#cfe0f0;padding:64px 0;margin-top:40px;}\nfooter .wrap{display:flex;flex-direction:column;gap:14px;}\nfooter a{color:#fff;font-weight:600;border-bottom:1px solid rgba(255,255,255,.35);}\nfooter .small{font-size:14px;color:#8fb4d8;}\n\n/* ---- Back to top ---- */\n#totop{\n  position:fixed;right:28px;bottom:28px;width:46px;height:46px;border-radius:50%;\n  background:var(--primary);color:#fff;border:none;cursor:pointer;font-size:20px;\n  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;\n  transition:opacity .25s,transform .15s;box-shadow:0 8px 24px rgba(15,58,102,.3);z-index:50;\n}\n#totop.show{opacity:1;pointer-events:auto;}\n#totop:hover{transform:translateY(-3px);}\n\n/* ===================== RESPONSIVE ===================== */\n@media (max-width:980px){\n  :root{--pad-x:24px;--sec-gap:72px;}\n  .shell{grid-template-columns:1fr;}\n  .sidebar{display:none;}\n  .topbar{\n    display:flex;position:sticky;top:0;z-index:40;background:rgba(250,250,250,.94);\n    backdrop-filter:blur(8px);border-bottom:1px solid var(--border);\n    padding:12px 24px;gap:8px;overflow-x:auto;align-items:center;\n  }\n  .topbar .brand{font-weight:700;font-size:14px;color:var(--primary-dark);white-space:nowrap;margin-right:8px;}\n  .topbar a{font-size:13px;color:var(--n700);white-space:nowrap;padding:6px 10px;border-radius:var(--radius-btn);}\n  .topbar a.active{background:#eef4fa;color:var(--primary);font-weight:600;}\n  .kpi-grid.cols-3,.kpi-grid.cols-2{grid-template-columns:1fr;}\n  .hero{padding:80px 0 72px;}\n  .insight{grid-template-columns:48px 1fr;gap:16px;padding:24px;}\n  .insight .circ{width:44px;height:44px;font-size:19px;}\n}\n@media (min-width:981px) and (max-width:1180px){\n  .shell{grid-template-columns:200px 1fr;}\n}\n\n/* ===================== PRINT ===================== */\n@media print{\n  :root{--sec-gap:36px;}\n  body{background:#fff;font-size:13px;}\n  .sidebar,.topbar,#totop,.hero-cta{display:none!important;}\n  .shell{display:block;max-width:none;}\n  .wrap{max-width:none;padding:0 18mm;}\n  .hero{background:var(--primary-dark)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:48px 0;}\n  .reveal{opacity:1!important;transform:none!important;}\n  section.block{padding:28px 0;page-break-inside:avoid;}\n  .kpi,.insight,.rec,.lim,figure.chart,ol.steps li{break-inside:avoid;box-shadow:none!important;}\n  .kpi.grad,.insight .circ,.badge{-webkit-print-color-adjust:exact;print-color-adjust:exact;}\n  a{color:var(--n900);}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<button id=\"totop\" aria-label=\"Volver arriba\">↑<\u002Fbutton>\n\n<!-- Mobile top nav -->\n<nav class=\"topbar\">\n  <span class=\"brand\">Churn · Ejecutivo<\u002Fspan>\n  <a href=\"#problema\">Problema<\u002Fa>\n  <a href=\"#hallazgos\">Hallazgos<\u002Fa>\n  <a href=\"#herramienta\">Herramienta<\u002Fa>\n  <a href=\"#recomendaciones\">Acciones<\u002Fa>\n  <a href=\"#limitaciones\">Límites<\u002Fa>\n  <a href=\"#proximos\">Próximos pasos<\u002Fa>\n<\u002Fnav>\n\n<div class=\"shell\">\n  <!-- Sidebar -->\n  <aside class=\"sidebar\">\n    <div class=\"brand\">Predicción de Churn<\u002Fdiv>\n    <div class=\"brand-sub\">Reporte Ejecutivo<\u002Fdiv>\n    <nav>\n      <ul class=\"navlist\">\n        <li><a href=\"#hero\">Inicio<\u002Fa><\u002Fli>\n        <li><a href=\"#problema\">El problema<\u002Fa><\u002Fli>\n        <li><a href=\"#hallazgos\">Qué descubrimos<\u002Fa><\u002Fli>\n        <li><a href=\"#herramienta\">La herramienta<\u002Fa><\u002Fli>\n        <li><a href=\"#recomendaciones\">Recomendaciones<\u002Fa><\u002Fli>\n        <li><a href=\"#limitaciones\">Limitaciones<\u002Fa><\u002Fli>\n        <li><a href=\"#proximos\">Próximos pasos<\u002Fa><\u002Fli>\n      <\u002Ful>\n    <\u002Fnav>\n  <\u002Faside>\n\n  <main class=\"content\">\n    <!-- HERO -->\n    <header class=\"hero\" id=\"hero\">\n      <div class=\"wrap\">\n        <div class=\"kicker\">TP Final · Inteligencia Artificial Aplicada a Negocios<\u002Fdiv>\n        <h1>Predicción de Churn de Clientes<\u002Fh1>\n        <p class=\"subtitle\">Reporte ejecutivo para gerencia comercial<\u002Fp>\n        <div class=\"hero-meta\">\n          <div>\n            <div class=\"lbl\">Equipo<\u002Fdiv>\n            <div class=\"team\">Bautista Rios · Tomás Attas · Agustín Venutolo · Francisco Cavanna · Agustin Picciolo<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div class=\"lbl\">Fecha<\u002Fdiv>\n            <div class=\"val\">Junio 2026<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div class=\"lbl\">Carrera<\u002Fdiv>\n            <div class=\"val\">Lic. en Negocios y Tecnología<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"hero-cta\">\n          <button class=\"btn btn-primary\" onclick=\"window.print()\">⤓ Imprimir / Descargar PDF<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- 1. EL PROBLEMA -->\n    <section class=\"block\" id=\"problema\">\n      <div class=\"wrap\">\n        <div class=\"divider-head reveal\">\n          <div class=\"line\"><\u002Fdiv>\n          <span class=\"kicker\">Sección 1<\u002Fspan>\n          <h2>El problema que nos pidieron resolver<\u002Fh2>\n        <\u002Fdiv>\n        <blockquote class=\"callout reveal\" style=\"margin-bottom:48px;max-width:62ch;\">\n          \"¿Podemos detectar quiénes están por irse antes de que dejen de comprar? ¿Por qué nos dejan?\"\n          <span style=\"display:block;font-style:normal;font-size:15px;color:var(--n500);margin-top:12px;\">— Gerente comercial<\u002Fspan>\n        <\u002Fblockquote>\n        <div class=\"kpi-grid cols-3 reveal\">\n          <div class=\"kpi accent\">\n            <div class=\"lbl\">Churn de la base<\u002Fdiv>\n            <div class=\"num\">17%<\u002Fdiv>\n            <div class=\"desc\">De los clientes se dan de baja cada año.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"kpi\">\n            <div class=\"lbl\">Clientes perdidos<\u002Fdiv>\n            <div class=\"num\">945<\u002Fdiv>\n            <div class=\"desc\">Bajas registradas el último año sobre la base de 5.630.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"kpi\">\n            <div class=\"lbl\">Costo de reemplazo<\u002Fdiv>\n            <div class=\"num\">5–7×<\u002Fdiv>\n            <div class=\"desc\">Más caro adquirir un cliente nuevo que retener uno actual (estándar de industria).<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"lead reveal\" style=\"margin-top:40px;\">\n          Cada baja no es solo una venta perdida: es el costo de haber adquirido a ese cliente, más el de salir a reemplazarlo. <strong>Detectar a tiempo quién está por irse<\u002Fstrong> convierte un gasto reactivo en una intervención dirigida y mucho más barata.\n        <\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 2. QUÉ DESCUBRIMOS -->\n    <section class=\"block\" id=\"hallazgos\">\n      <div class=\"wrap\">\n        <div class=\"divider-head reveal\">\n          <div class=\"line\"><\u002Fdiv>\n          <span class=\"kicker\">Sección 2<\u002Fspan>\n          <h2>Qué descubrimos<\u002Fh2>\n          <p class=\"lede\">Cuatro hallazgos accionables — algunos confirman la intuición del negocio, otros la contradicen.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"stack\">\n          <div class=\"insight reveal\">\n            <div class=\"circ\">1<\u002Fdiv>\n            <div>\n              <h3>La tasa mensual de actividad es el predictor más fuerte<\u002Fh3>\n              <p>Un cliente con pocas órdenes y poco cashback <strong>por mes de antigüedad<\u002Fstrong> es el de mayor riesgo. Lo que importa no es \"cuánto compra\", sino cuánto compra en relación a los meses que lleva con nosotros.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"insight reveal\">\n            <div class=\"circ\">2<\u002Fdiv>\n            <div>\n              <h3>Los primeros 3 meses concentran el mayor riesgo<\u002Fh3>\n              <p>Los clientes nuevos (≤3 meses) churnean <span class=\"stat\">~50%<\u002Fspan> frente a menos del 10% en los que llevan más de un año. La ventana de onboarding es el momento de máxima palanca.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"insight reveal\">\n            <div class=\"circ\">3<\u002Fdiv>\n            <div>\n              <h3>La regla \"email a los 15 días sin compra\" no se sostiene<\u002Fh3>\n              <p>Los datos muestran que los clientes que se van compraron <strong>más recientemente<\u002Fstrong> (mediana 2 días vs 4). El verdadero patrón es <span class=\"stat\">compra reciente + queja sin resolver = 39% churn<\u002Fspan>, contra 7% en el escenario opuesto.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"insight reveal\">\n            <div class=\"circ\">4<\u002Fdiv>\n            <div>\n              <h3>La satisfacción auto-reportada no predice churn<\u002Fh3>\n              <p>Los clientes que se van reportan un score <strong>más alto<\u002Fstrong> (3,4 vs 3,0). Es un indicador a re-evaluar antes de usarlo como gatillo de campañas.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <figure class=\"chart reveal\" style=\"margin-top:40px;\">\n          <img src=\"186d92a6-264b-447e-869c-7d4e1ab748e6\" alt=\"Factores que más pesan en la predicción de churn\">\n          <figcaption>Los 3 factores que más pesan: cuánto compra el cliente por mes, hace cuánto que es cliente, y cuánto cashback recibe por mes.<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 3. LA HERRAMIENTA -->\n    <section class=\"block\" id=\"herramienta\">\n      <div class=\"wrap\">\n        <div class=\"divider-head reveal\">\n          <div class=\"line\"><\u002Fdiv>\n          <span class=\"kicker\">Sección 3<\u002Fspan>\n          <h2>La herramienta<\u002Fh2>\n        <\u002Fdiv>\n        <div class=\"bigquote reveal\" style=\"margin-bottom:48px;\">\n          Detecta 95 de cada 100 clientes que se van — con tiempo para intervenir.\n          <span class=\"src\">Como el radar de una guardia: prioriza a quién mirar primero.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"kpi-grid cols-2 reveal\">\n          <div class=\"kpi grad\">\n            <div class=\"lbl\">Recall — cobertura<\u002Fdiv>\n            <div class=\"num\">95,3%<\u002Fdiv>\n            <div class=\"desc\">Sobre 190 churners reales, detectó 181. Casi nadie se escapa del radar.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"kpi success\">\n            <div class=\"lbl\">Precision — puntería<\u002Fdiv>\n            <div class=\"num\">81,2%<\u002Fdiv>\n            <div class=\"desc\">De cada 10 alertas, 8 son clientes que efectivamente estaban por irse.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <figure class=\"chart reveal\" style=\"margin-top:40px;\">\n          <img src=\"e1337b09-30f9-4e30-9888-600e7657a0f8\" alt=\"Curvas de performance del modelo en datos nuevos\">\n          <figcaption>Performance del modelo sobre clientes que no había visto antes. Cuanto más arriba y a la derecha la curva, mejor la herramienta.<\u002Ffigcaption>\n        <\u002Ffigure>\n        <p class=\"lead reveal\" style=\"margin-top:40px;\">\n          La herramienta puede <strong>revisar la base completa cada noche<\u002Fstrong> y producir, a la mañana siguiente, una lista priorizada de clientes en riesgo. El equipo de retención trabaja sobre nombres concretos, no sobre intuiciones.\n        <\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 4. RECOMENDACIONES -->\n    <section class=\"block\" id=\"recomendaciones\">\n      <div class=\"wrap\">\n        <div class=\"divider-head reveal\">\n          <div class=\"line\"><\u002Fdiv>\n          <span class=\"kicker\">Sección 4<\u002Fspan>\n          <h2>Cuatro recomendaciones accionables<\u002Fh2>\n          <p class=\"lede\">Cada una con prioridad, plazo, responsable y la métrica de impacto que esperamos mover.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"kpi-grid cols-2\">\n          <div class=\"rec reveal\">\n            <div class=\"badges\">\n              <span class=\"badge pri-alta\">● Alta<\u002Fspan>\n              <span class=\"badge neutral\">30 días<\u002Fspan>\n              <span class=\"badge neutral\">Marketing Retención<\u002Fspan>\n            <\u002Fdiv>\n            <h3>A · Reorientar campañas hacia la tasa mensual de actividad<\u002Fh3>\n            <p style=\"color:var(--n700);font-size:15px;\">Reemplazar la regla de \"15 días sin compra\" por las señales de órdenes y cashback por mes de antigüedad.<\u002Fp>\n            <div class=\"impact\"><strong>Impacto:<\u002Fstrong> ≥85% Recall en las alertas, frente a menos del 50% con la regla anterior.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"rec reveal\">\n            <div class=\"badges\">\n              <span class=\"badge pri-alta\">● Alta<\u002Fspan>\n              <span class=\"badge neutral\">Inmediato<\u002Fspan>\n              <span class=\"badge neutral\">Customer Success<\u002Fspan>\n            <\u002Fdiv>\n            <h3>B · Atención one-on-one para nuevos con queja<\u002Fh3>\n            <p style=\"color:var(--n700);font-size:15px;\">El cruce \"cliente nuevo + queja reciente\" es el de mayor riesgo individual. Merece contacto humano, no automatizado.<\u002Fp>\n            <div class=\"impact\"><strong>Impacto:<\u002Fstrong> reducir el churn de ese segmento de 39% a 25%.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"rec reveal\">\n            <div class=\"badges\">\n              <span class=\"badge pri-media\">● Media<\u002Fspan>\n              <span class=\"badge neutral\">90 días<\u002Fspan>\n              <span class=\"badge neutral\">CS + Producto<\u002Fspan>\n            <\u002Fdiv>\n            <h3>C · Onboarding estructurado de 90 días<\u002Fh3>\n            <p style=\"color:var(--n700);font-size:15px;\">Acompañar activamente la ventana donde se concentra la mitad del churn de la base.<\u002Fp>\n            <div class=\"impact\"><strong>Impacto:<\u002Fstrong> reducir el churn de clientes nuevos de 50% a 30%.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"rec reveal\">\n            <div class=\"badges\">\n              <span class=\"badge pri-baja\">● Baja<\u002Fspan>\n              <span class=\"badge neutral\">30 días<\u002Fspan>\n              <span class=\"badge neutral\">Analytics<\u002Fspan>\n            <\u002Fdiv>\n            <h3>D · Re-evaluar la satisfacción como gatillo<\u002Fh3>\n            <p style=\"color:var(--n700);font-size:15px;\">El score auto-reportado no anticipa la baja. Conviene pausar su uso como disparador de campañas.<\u002Fp>\n            <div class=\"impact\"><strong>Impacto:<\u002Fstrong> ahorro de campañas mal dirigidas y menos ruido sobre la base.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 5. LIMITACIONES -->\n    <section class=\"block\" id=\"limitaciones\">\n      <div class=\"wrap\">\n        <div class=\"divider-head reveal\">\n          <div class=\"line\"><\u002Fdiv>\n          <span class=\"kicker\">Sección 5<\u002Fspan>\n          <h2>Lo que la herramienta todavía no resuelve<\u002Fh2>\n          <p class=\"lede\">Tres salvedades honestas para usar la herramienta con criterio.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"stack\">\n          <div class=\"lim reveal\">\n            <h3>Sobre la variable de quejas<\u002Fh3>\n            <p>No podemos confirmar el momento exacto en que se registró cada queja, así que la dejamos fuera del modelo por precaución. Si el equipo de datos valida el timing, recuperaríamos cerca de 1% más de detección.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"lim reveal\">\n            <h3>Sobre las falsas alarmas<\u002Fh3>\n            <p>Una de cada cinco alertas no se materializa: alrededor de 42 contactos innecesarios cada 223 alertas. El costo es bajo, pero conviene tenerlo en cuenta para no saturar a la base con mensajes.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"lim reveal\">\n            <h3>Sobre causalidad<\u002Fh3>\n            <p>El modelo identifica <strong>patrones<\u002Fstrong>, no causas. Antes de escalar cualquier campaña conviene validarla con un test A/B para confirmar que la acción realmente mueve la aguja.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 6. PRÓXIMOS PASOS -->\n    <section class=\"block\" id=\"proximos\">\n      <div class=\"wrap\">\n        <div class=\"divider-head reveal\">\n          <div class=\"line\"><\u002Fdiv>\n          <span class=\"kicker\">Sección 6<\u002Fspan>\n          <h2>Próximos pasos<\u002Fh2>\n          <p class=\"lede\">Ordenados por impacto esperado.<\u002Fp>\n        <\u002Fdiv>\n        <ol class=\"steps reveal\">\n          <li><span><strong>Validar el timing de las quejas<\u002Fstrong> con el equipo de datos (semana 1).<\u002Fspan><\u002Fli>\n          <li><span><strong>Activar campañas por tasa mensual de actividad<\u002Fstrong> y medir resultados a 30 / 60 / 90 días.<\u002Fspan><\u002Fli>\n          <li><span><strong>A/B testing<\u002Fstrong> de las acciones B (nuevos con queja) y C (onboarding de 90 días).<\u002Fspan><\u002Fli>\n          <li><span><strong>Re-entrenar el modelo trimestralmente<\u002Fstrong> con datos frescos.<\u002Fspan><\u002Fli>\n          <li><span><strong>Análisis profundo del segmento Single<\u002Fstrong>, que muestra 26,7% de churn.<\u002Fspan><\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- FOOTER -->\n    <footer>\n      <div class=\"wrap\">\n        <div style=\"font-size:20px;font-weight:700;color:#fff;letter-spacing:-0.02em;\">Predicción de Churn de Clientes<\u002Fdiv>\n        <div>Reporte completo, código y decisiones disponibles para validación:<\u002Fdiv>\n        <div><a href=\"https://github.com/tattas21/churn_tp\" target=\"_blank\" rel=\"noopener\">github.com/tattas21/churn_tp<\u002Fa><\u002Fdiv>\n        <div class=\"small\" style=\"margin-top:18px;\">Bautista Rios · Tomás Attas · Agustín Venutolo · Francisco Cavanna · Agustin Picciolo — Junio 2026<\u002Fdiv>\n        <div class=\"small\">Inteligencia Artificial Aplicada a Negocios · Licenciatura en Negocios y Tecnología<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<script>\n/* Reveal on scroll */\nconst io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:0.12,rootMargin:'0px 0px -8% 0px'});\ndocument.querySelectorAll('.reveal').forEach(el=>io.observe(el));\n\n/* Scroll spy */\nconst links=[...document.querySelectorAll('.navlist a, .topbar a')];\nconst map={};links.forEach(a=>{const id=a.getAttribute('href').slice(1);(map[id]=map[id]||[]).push(a);});\nconst sections=[...document.querySelectorAll('section.block, header.hero')];\nconst spy=new IntersectionObserver((es)=>{\n  es.forEach(e=>{\n    if(e.isIntersecting){\n      links.forEach(a=>a.classList.remove('active'));\n      (map[e.target.id]||[]).forEach(a=>a.classList.add('active'));\n    }\n  });\n},{rootMargin:'-45% 0px -50% 0px'});\nsections.forEach(s=>spy.observe(s));\n\n/* Back to top */\nconst tt=document.getElementById('totop');\ntt.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));\nwindow.addEventListener('scroll',()=>{tt.classList.toggle('show',window.scrollY>800);},{passive:true});\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
